<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0f0f0f">
    <meta name="description" content="Confira as ofertas imperdíveis do Supermercado Ofertas">

    <title>Ofertas do Mercado</title>

    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css">

    <!-- Pré-conexão para carregamento rápido -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <!-- Config -->
    <script src="config/config.js"></script>
</head>
<body>
    <!-- Loading Spinner -->
    <div id="loadingSpinner" class="loading-spinner"></div>

    <!-- Estado vazio (sem ofertas) -->
    <div id="emptyState" class="empty-state hidden">
        <div class="empty-icon">📭</div>
        <p>Nenhuma oferta disponível no momento.</p>
    </div>

    <!-- Header -->
    <header class="header">
        <img class="header-logo" src="/logo_atacadao.png" alt="Atacadão" />
    </header>

    <!-- Contador -->
    <div id="ofertaCounter" class="oferta-counter"></div>

    <!-- Indicadores de página (bolinhas) -->
    <nav id="dotsIndicator" class="dots-indicator" aria-label="Navegação entre ofertas"></nav>

    <!-- Container principal de ofertas -->
    <div id="ofertasContainer" class="ofertas-container">
        <!-- Cards serão renderizados via JavaScript -->
    </div>

    <!-- Botão tela cheia -->
    <button id="fullscreenBtn" class="fullscreen-btn" aria-label="Alternar tela cheia" title="Tela cheia">
        <svg class="fullscreen-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="15 3 21 3 21 9"></polyline>
            <polyline points="9 21 3 21 3 15"></polyline>
            <line x1="21" y1="3" x2="14" y2="10"></line>
            <line x1="3" y1="21" x2="10" y2="14"></line>
        </svg>
        <svg class="fullscreen-exit-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none">
            <polyline points="4 14 10 14 10 20"></polyline>
            <polyline points="20 10 14 10 14 4"></polyline>
            <line x1="14" y1="10" x2="21" y2="3"></line>
            <line x1="3" y1="21" x2="10" y2="14"></line>
        </svg>
    </button>

    <!-- Indicador de swipe -->
    <div id="swipeIndicator" class="swipe-indicator">
        <div class="arrow"></div>
        <span>Deslize para ver mais</span>
    </div>

    <!-- Script principal -->
    <script src="js/app.js"></script>
</body>
</html>
