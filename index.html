<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0f0f0f">
    <meta name="description" content="Confira as ofertas imperdíveis do Supermercado Ofertas">

    <title>Ofertas do Mercado</title>

    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css">

    <!-- Pré-conexão para carregamento rápido -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <!-- Config -->
    <script src="config/config.js"></script>
</head>
<body>
    <!-- Loading Spinner -->
    <div id="loadingSpinner" class="loading-spinner"></div>

    <!-- Estado vazio (sem ofertas) -->
    <div id="emptyState" class="empty-state hidden">
        <div class="empty-icon">📭</div>
        <p>Nenhuma oferta disponível no momento.</p>
    </div>

    <!-- Header -->
    <header class="header">
        <img id="logoHeader" class="header-logo" src="assets/logo_atacadao.png" alt="Logo" />
    </header>

    <!-- Contador -->
    <div id="ofertaCounter" class="oferta-counter"></div>

    <!-- Container principal de ofertas -->
    <div id="ofertasContainer" class="ofertas-container">
        <!-- Cards serão renderizados via JavaScript -->
    </div>

    <!-- Indicador de swipe -->
    <div id="swipeIndicator" class="swipe-indicator">
        <div class="arrow"></div>
        <span>Deslize para ver mais</span>
    </div>

    <!-- Script principal -->
    <script src="js/app.js"></script>
</body>
</html>
